<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发货合同收款统计看板</title>
<script src="js/echarts.min.js"></script>
<style>
:root {
  --primary: #409EFF;
  --success: #67C23A;
  --warning: #E6A23C;
  --danger: #F56C6C;
  --bg: #f0f2f5;
  --card-bg: #ffffff;
  --text: #303133;
  --text-secondary: #909399;
  --border: #ebeef5;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 0 20px;
  max-width: 1920px;
  margin: 0 auto;
}

.header {
  text-align: center;
  padding: 10px 0 16px;
}
.header h1 {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 2px;
}

/* 大区卡片 */
.cards-wrap {
  display: grid;
  gap: 28px;
  margin: 0 auto 36px;
  max-width: 1920px;
}
.card {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 20px 16px;
  box-shadow: var(--shadow);
  text-align: center;
  transition: transform 0.15s;
}
.card:hover { transform: translateY(-2px); }
.card .region-name {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 12px;
}
.card .row {
  margin-bottom: 8px;
}
.card .row-label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
}
.card .row-value {
  font-size: 30px;
  font-weight: 700;
  color: var(--text);
  text-align: center;
}
.card .row-value .unit {
  font-size: 14px;
  font-weight: 400;
  color: var(--text-secondary);
  margin-left: 2px;
}
.card .row-value .slash { color: var(--text-secondary); font-weight: 400; margin: 0 2px; }
.card .row-value .val { }
.card .row-value .val.high { color: var(--danger); }
.card .row-value .val.medium { color: var(--warning); }
.card .row-value .val.low { color: var(--success); }
.card .legend-line {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 10px;
}

/* 按钮栏 */
.toolbar {
  max-width: 1920px;
  margin: 0 auto 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.toolbar-center {
  display: flex;
  gap: 10px;
}
.toolbar-right {
  position: absolute;
  right: 0;
  display: flex;
  gap: 10px;
}
.toolbar button {
  padding: 9px 22px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card-bg);
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
  outline: none;
}
.toolbar button:focus,
.toolbar button:focus-visible { outline: none; }
.toolbar button:hover { border-color: var(--primary); color: var(--primary); }
.toolbar button.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.toolbar button.export-btn {
  background: var(--success);
  color: #fff;
  border-color: var(--success);
}
.toolbar button.export-btn:hover { opacity: 0.85; }

/* 图表区 */
.content {
  max-width: 1920px;
  margin: 0 auto;
}
#chart-view { display: block; }
.chart-box {
  background: var(--card-bg);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 20px;
  margin-top: 4px;
}
.chart-title {
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 12px;
}
.chart-toolbar {
  display: flex;
  align-items: center;
  padding: 0 8px 8px;
}
.chart-toolbar select {
  margin-left: auto;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-family: inherit;
  background: var(--card-bg);
  color: var(--text);
  cursor: pointer;
  outline: none;
}
.chart-toolbar select:focus { border-color: var(--primary); }
#barChart { min-height: 420px; }

/* 表格视图 */
.table-wrap {
  background: var(--card-bg);
  border-radius: 10px;
  box-shadow: var(--shadow);
  overflow-x: auto;
  padding: 8px;
  min-height: 200px;
  width: 100%;
  margin: 0 auto;
}
.table-wrap table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.table-wrap th {
  background: var(--primary);
  color: #fff;
  padding: 5px 6px;
  text-align: center;
  font-weight: 600;
  font-size: 12px;
  border: 1px solid var(--border);
  position: sticky; top: 0;
}
.table-wrap td {
  padding: 3px 4px;
  text-align: center;
  border: 1px solid var(--border);
}
.table-wrap .module-row td:first-child { text-align: left; padding-left: 20px; }
.table-wrap .subtotal-row td {
  font-weight: 700;
  background: #E8F0FE;
}
.table-wrap .total-row td {
  font-weight: 700;
  background: #D4E4FC;
  font-size: 13px;
}
.num { text-align: center !important; font-variant-numeric: tabular-nums; }
.pct-high { color: var(--danger); font-weight: 700; }
.pct-medium { color: var(--warning); font-weight: 700; }
.pct-low { color: var(--success); font-weight: 700; }

#table-view { display: none; }

@media (max-width: 900px) {
  .cards-wrap { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)) !important; }
}
</style>
</head>

function fmtInt(n) { return Math.round(Number(n)).toLocaleString('zh-CN'); }
function fmtPct(n) { return Number(n).toFixed(2) + '%'; }

// ---- 大区卡片 ----
function renderCards(metric) {
  var wrap = document.getElementById('cardsWrap');
  wrap.style.gridTemplateColumns = 'repeat(' + DATA.regions.length + ', 1fr)';
  wrap.innerHTML = DATA.regions.map(function(r, i) {
    var isRate = metric === 'rate';
    var label = isRate ? 'T/T回款百分比' : 'T/T待回款';
    var val = isRate ? fmtPct(r.tt_rate) : fmtInt(r.tt_pending);
    var unit = isRate ? '%' : '万元';
    var palette = ['#E74C3C', '#3498DB', '#2ECC71', '#F39C12', '#9B59B6', '#1ABC9C', '#E67E22'];
    var color = palette[i % palette.length];
    return '<div class="card">' +
      '<div class="region-name">' + r.name + '</div>' +
      '<div class="row">' +
        '<div class="row-value"><span class="val" style="color:' + color + '">' + val + '</span><span class="unit">' + unit + '</span></div>' +
        '<div class="row-label">' + label + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ---- 表G ----
function pctCls(v) { return v >= 70 ? 'pct-high' : (v >= 40 ? 'pct-medium' : 'pct-low'); }

function renderTableG() {
  var tbody = document.querySelector('#tableG tbody');
  tbody.innerHTML = DATA.table_g.map(function(r) {
    var rowClass = r.type === 'subtotal' ? 'subtotal-row' : (r.type === 'total' ? 'total-row' : 'module-row');
    var label = r.type === 'module' ? r.module : (r.type === 'subtotal' ? r.region + ' 小计' : '全国贸合计');
    if (r.type === 'module') label = '&nbsp;&nbsp;&nbsp;&nbsp;' + label;
    return '<tr class="' + rowClass + '">' +
      '<td>' + label + '</td>' +
      '<td class="num">' + fmtInt(r.contract_amount) + '</td>' +
      '<td class="num">' + fmtInt(r.payment) + '</td>' +
      '<td class="num">' + fmtInt(r.pending) + '</td>' +
      '<td class="' + pctCls(r.rate) + '">' + fmtPct(r.rate) + '</td>' +
      '<td class="num">' + fmtInt(r.tt_contract_amount) + '</td>' +
      '<td class="num">' + fmtInt(r.tt_payment) + '</td>' +
      '<td class="num">' + fmtInt(r.tt_pending) + '</td>' +
      '<td class="' + pctCls(r.tt_rate) + '">' + fmtPct(r.tt_rate) + '</td>' +
      '<td class="num">' + fmtInt(r.oa_contract_amount) + '</td>' +
      '<td class="num">' + fmtInt(r.oa_payment) + '</td>' +
      '<td class="num">' + fmtInt(r.oa_pending) + '</td>' +
      '<td class="' + pctCls(r.oa_rate) + '">' + fmtPct(r.oa_rate) + '</td>' +
    '</tr>';
  }).join('');
}

// ---- ECharts ----
var barChart = null;

function getChartOption(metric) {
  var regionNames = DATA.regions.map(function(r) { return r.name; });
  var isRate = metric === 'rate';

  if (isRate) {
    return {
      tooltip: {
        trigger: 'axis',
        formatter: function(p) {
          return p.map(function(s) { return s.marker + s.seriesName + ': ' + s.value.toFixed(2) + '%'; }).join('<br/>');
        }
      },
      legend: { show: true, top: 0, data: ['全部', 'T/T', 'O/A'] },
      grid: { left: 8, right: 8, top: 36, bottom: 8, containLabel: true },
      xAxis: { type: 'category', data: regionNames, axisLabel: { rotate: regionNames.length > 6 ? 30 : 0 } },
      yAxis: { type: 'value', axisLabel: { formatter: '{value}%' } },
      series: [
        { name: '全部', type: 'bar', barMaxWidth: 50, data: DATA.regions.map(function(r) { return r.rate; }), itemStyle: { color: '#409EFF' } },
        { name: 'T/T', type: 'bar', barMaxWidth: 50, data: DATA.regions.map(function(r) { return r.tt_rate; }), itemStyle: { color: '#67C23A' } },
        { name: 'O/A', type: 'bar', barMaxWidth: 50, data: DATA.regions.map(function(r) { return r.oa_rate; }), itemStyle: { color: '#E6A23C' } },
      ],
    };
  } else {
    return {
      tooltip: {
        trigger: 'axis',
        formatter: function(p) { return p.map(function(s) { return s.marker + s.seriesName + ': ' + fmtInt(s.value) + '万元'; }).join('<br/>'); }
      },
      legend: { show: true, top: 0, data: ['全部', 'T/T', 'O/A'] },
      grid: { left: 8, right: 8, top: 36, bottom: 8, containLabel: true },
      xAxis: { type: 'category', data: regionNames, axisLabel: { rotate: regionNames.length > 6 ? 30 : 0 } },
      yAxis: { type: 'value' },
      series: [
        { name: '全部', type: 'bar', barMaxWidth: 50, data: DATA.regions.map(function(r) { return r.pending; }), itemStyle: { color: '#409EFF' } },
        { name: 'T/T', type: 'bar', barMaxWidth: 50, data: DATA.regions.map(function(r) { return r.tt_pending; }), itemStyle: { color: '#67C23A' } },
        { name: 'O/A', type: 'bar', barMaxWidth: 50, data: DATA.regions.map(function(r) { return r.oa_pending; }), itemStyle: { color: '#E6A23C' } },
      ],
    };
  }
}

function initCharts() {
  var barDom = document.getElementById('barChart');
  barChart = echarts.init(barDom);
  barChart.setOption(getChartOption('pending'));
  window.addEventListener('resize', function() { barChart.resize(); });
}

function updateChart() {
  var metric = document.getElementById('chartMetric').value;
  renderCards(metric);
  barChart.setOption(getChartOption(metric), true);
}

// ---- 视图切换 ----
function switchView(view) {
  document.getElementById('btnChart').classList.toggle('active', view === 'chart');
  document.getElementById('btnTable').classList.toggle('active', view === 'table');
  document.getElementById('chart-view').style.display = view === 'chart' ? 'block' : 'none';
  document.getElementById('table-view').style.display = view === 'table' ? 'block' : 'none';
  if (view === 'chart') window.dispatchEvent(new Event('resize'));
}

// ---- 导出 ----
function downloadBase64(b64, filename) {
  var byteChars = atob(b64);
  var byteNums = new Array(byteChars.length);
  for (var i = 0; i < byteChars.length; i++) {
    byteNums[i] = byteChars.charCodeAt(i);
  }
  var byteArr = new Uint8Array(byteNums);
  var blob = new Blob([byteArr], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
  URL.revokeObjectURL(link.href);
}

function exportTableF() {
  downloadBase64(DATA.__exports__.tableF, '表F_发货合同收款统计.xlsx');
}

function exportTableG() {
  downloadBase64(DATA.__exports__.tableG, '表G_发货合同收款合计.xlsx');
}

// ---- 初始化 ----
renderCards('pending');
renderTableG();
initCharts();
</script>
